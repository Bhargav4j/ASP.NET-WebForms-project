version: '3.8'

services:
  aspwebformsprojectcont:
    image: aspwebformsprojectcont:latest
    container_name: aspwebformsprojectcont
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_RUNNING_IN_CONTAINER=true
      - TZ=UTC
      # External service connections (configure as needed)
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:-Server=db-host;Database=appdb;User=dbuser;Password=dbpass;}
      - Redis__ConnectionString=${REDIS_CONNECTION_STRING:-redis-host:6379}
      - Kafka__BootstrapServers=${KAFKA_BOOTSTRAP_SERVERS:-kafka-host:9092}
    volumes:
      - ./logs:/app/logs
      - ./appsettings:/app/appsettings:ro
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  app-network:
    driver: bridge

volumes:
  logs:
  appsettings: